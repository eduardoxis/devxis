<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DEVXIS | Portal do cliente</title>
    <link rel="icon" href="../assets/images/logo-devxis.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css?v=menu-mobile-4" />
    <link rel="stylesheet" href="../css/solid-colors.css?v=shared-navigation-6" />
    <link rel="stylesheet" href="../css/workspace.css?v=shared-navigation-6" />
  </head>
  <body class="workspace-page">
    <header class="site-header">
      <a class="brand" href="../index.html#inicio" aria-label="DEVXIS, início"
        ><img src="../assets/images/logo-devxis.png" alt="DEVXIS" /><span
          >dev<span>xis</span></span
        ></a
      >
      <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <nav aria-label="Menu principal">
        <a href="../index.html#sobre">Sobre</a
        ><a href="../index.html#servicos">Como funciona</a
        ><a href="../index.html#precos">Planos</a>
      </nav>
      <a class="button primary header-cta" href="../index.html#orcamento"
        >Começar agora <span>→</span></a
      >
      <div class="profile-area">
        <button
          id="profile-menu"
          class="profile-button"
          type="button"
          aria-label="Minha conta"
        >
          Entrar</button
        ><button id="portal-logout" class="ws-button" type="button" hidden>
          Sair
        </button>
      </div>
    </header>
    <div id="mobile-menu-backdrop" hidden></div>
    <aside id="mobile-drawer" aria-label="Menu mobile" aria-hidden="true">
      <div class="mobile-drawer__head">
        <a class="brand" href="../index.html#inicio"
          ><img src="../assets/images/logo-devxis.png" alt="DEVXIS" /><span
            >dev<span>xis</span></span
          ></a
        ><button id="mobile-menu-close" type="button" aria-label="Fechar menu">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <nav class="mobile-drawer__links">
        <a href="../index.html#tecnologias"
          ><svg viewBox="0 0 24 24">
            <path d="m8 5-7 7 7 7M16 5l7 7-7 7M14 3l-4 18" /></svg
          ><span>Tecnologias</span><b>›</b></a
        ><a href="../index.html#precos"
          ><svg viewBox="0 0 24 24">
            <path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 17l9 5 9-5" /></svg
          ><span>Planos</span><b>›</b></a
        ><a href="../index.html#depoimentos"
          ><svg viewBox="0 0 24 24">
            <path
              d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
            /></svg
          ><span>Parcerias</span><b>›</b></a
        ><a href="../index.html#orcamento"
          ><svg viewBox="0 0 24 24">
            <path
              d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8ZM7 9h10M7 13h6"
            /></svg
          ><span>Fale comigo</span><b>›</b></a
        >
      </nav>
      <a class="mobile-drawer__cta" href="../index.html#orcamento"
        ><svg viewBox="0 0 24 24">
          <path
            d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3ZM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"
          /></svg
        ><span
          ><strong>Vamos tirar sua ideia do papel?</strong
          ><small>Fale comigo e comece hoje mesmo.</small></span
        ><b>›</b></a
      >
    </aside>

    <main class="ws-shell">
      <section id="portal-auth" class="ws-auth">
        <p class="eyebrow">DEVXIS • ÁREA DO CLIENTE</p>
        <h1>Acompanhe seu projeto.</h1>
        <p>Propostas, entregas e decisões em um só lugar.</p>
        <form id="portal-login">
          <label
            >E-mail<input
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="160" /></label
          ><label
            >Senha<input
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="8"
              required /></label
          ><label class="ws-check"
            ><input name="remember" type="checkbox" checked />Manter
            conectado</label
          ><button class="ws-button primary" type="submit">Entrar</button
          ><button class="ws-button" id="portal-register" type="button">
            Criar conta</button
          ><button class="ws-button" id="portal-reset" type="button">
            Esqueci minha senha
          </button>
        </form>
        <p id="portal-auth-message" role="status"></p>
      </section>
      <section id="portal-view" hidden>
        <div id="portal-account"></div>
        <nav
          id="portal-tabs"
          class="ws-tabs"
          aria-label="Portal do cliente"
        ></nav>
        <div id="portal-content" class="ws-root"></div>
      </section>
    </main>
    <div id="toast" role="status"></div>
    <script
      type="module"
      src="../js/client/portal.js?v=account-persistence-4"
    ></script>
  </body>
</html>
